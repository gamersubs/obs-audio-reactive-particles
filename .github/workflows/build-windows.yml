name: Build Windows plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap OBS plugin template CMake
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP "obs-plugintemplate"
          if (Test-Path $template) { Remove-Item -Recurse -Force $template }
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git $template
          Copy-Item -Recurse -Force (Join-Path $template "cmake") (Join-Path $env:GITHUB_WORKSPACE "cmake")

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build_x64 --config Release --parallel

      - name: Install
        shell: pwsh
        run: cmake --install build_x64 --config Release --prefix package

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath obs-audio-reactive-particles-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-audio-reactive-particles-windows-x64
          path: obs-audio-reactive-particles-windows-x64.zip
          if-no-files-found: error
