name: Build Windows plugin

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\obs-plugins\64bit | Out-Null
          New-Item -ItemType Directory -Force -Path package\data\obs-plugins\audio-reactive-particles | Out-Null
          Copy-Item build\Release\obs-audio-reactive-particles.dll package\obs-plugins\64bit\
          Copy-Item data\* package\data\obs-plugins\audio-reactive-particles -Recurse -Force
          Compress-Archive -Path package\* -DestinationPath obs-audio-reactive-particles-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-audio-reactive-particles-windows-x64
          path: obs-audio-reactive-particles-windows-x64.zip
